version: '3.8'

services:
  backend:
    build: ./backend
    container_name: senodesu-backend
    ports:
      - "5000:5000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PORT=5000
      - NODE_ENV=production
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    restart: always
    networks:
      - senodesu-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: senodesu-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - API_BASE_URL=http://backend:5000/api
    restart: always
    networks:
      - senodesu-network

  nginx:
    image: nginx:latest
    container_name: senodesu-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - senodesu-network

networks:
  senodesu-network:
    driver: bridge
